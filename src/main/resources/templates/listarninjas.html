<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tabela de Ninjas</title>
</head>
<h1>
    Lista de ninjas
</h1>
<table>
    <thead>
        <tr>
            <th>ImgURL</th>
            <th>Id</th>
            <th>Mome</th>
            <th>Email</th>
            <th>Idade</th>
            <th>Rank</th>
            <th>Missoes</th>
        </tr>
    </thead>
    <tbody>
        <tr  th:each="ninja: ${ninjas}">

            <td> <img th:src="${ninja.imgURL}"> </td>
            <td th:text="${ninja.id}"> </td>
            <td th:text="${ninja.nome}"> </td>
            <td th:text="${ninja.email}"> </td>
            <td th:text="${ninja.rank}"> </td>
            <td th:text="${ninja.missoes}"> </td>
        </tr>
    </tbody>
</table>
<body>

</body>
</html>
